name: Deploy Product Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-privacy.yml"
      - "doc/privacy.md"
      - "landing/**"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "src/core/splitLayout.ts"
      - "src/landing.ts"
      - "vite.config.pages.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare build
        run: |
          npm ci
          mkdir -p .tmp/github-pages

      - name: Render privacy policy
        uses: docker://pandoc/core:2.11
        with:
          args: >-
            --to=html
            --shift-heading-level-by=1
            --output=.tmp/github-pages/privacy.html
            doc/privacy.md

      - name: Build product site
        run: npm run build:pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          force_orphan: true
