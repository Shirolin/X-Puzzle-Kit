<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dfeef0" />
    <title>X-Puzzle-Kit · 拼图与切图工具</title>
    <meta
      name="description"
      content="把多张图按横向、纵向、田字格或 T 型拼成一幅，也能把一张图横向或纵向切成最多 20 张。提供网页工作台与 Chrome 扩展。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="X-Puzzle-Kit · 拼图与切图工具" />
    <meta
      property="og:description"
      content="把多张图拼成一幅，也能把一张图横向或纵向切成最多 20 张。"
    />
    <link rel="icon" href="/assets/icon-32.png" type="image/png" />
    <link rel="stylesheet" href="./landing.css" />
    <script type="module" src="../src/landing.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header wrap">
      <a class="brand" href="./">
        <img src="/assets/icon-128.png" width="40" height="40" alt="" />
        X-Puzzle-Kit
      </a>
      <nav class="site-nav" aria-label="页面导航">
        <a href="#stitch">拼图</a>
        <a href="#split">切图演示</a>
        <a
          href="https://github.com/Shirolin/X-Puzzle-Kit/blob/main/doc/privacy.md"
        >
          隐私政策
        </a>
        <a href="https://github.com/Shirolin/X-Puzzle-Kit">GitHub</a>
      </nav>
    </header>

    <main id="main">
      <section class="stitch" id="stitch" aria-labelledby="stitch-title">
        <div class="stitch-inner wrap">
          <div class="stitch-copy">
            <h1 id="stitch-title">把多张图拼成一幅</h1>
            <p>
              支持横向、纵向、田字格和 T 型。<br />
              排好顺序，调整间距，再导出完整图片。
            </p>
          </div>

          <div class="stitch-flow">
            <figure>
              <figcaption><span>拼接前</span>4 张分图</figcaption>
              <div
                class="stitch-pieces"
                role="img"
                aria-label="河湾两岸和河道分在四张独立图片里"
              >
                <span></span><span></span><span></span><span></span>
              </div>
            </figure>

            <span class="stitch-arrow" aria-hidden="true">→</span>

            <figure>
              <figcaption><span>拼接后</span>1 张完整图</figcaption>
              <img
                class="stitch-result"
                src="./stitch-demo.webp"
                width="1200"
                height="800"
                alt="四张分图接合成同一幅峡谷图，河流连续穿过整张图片"
                fetchpriority="high"
                decoding="async"
              />
            </figure>
          </div>

          <div class="stitch-actions">
            <a class="button" href="../">
              打开网页工作台 <span aria-hidden="true">↗</span>
            </a>
            <a
              class="text-link"
              href="https://chromewebstore.google.com/detail/x-puzzle-kit-stitch-split/nadlbdmcfmjinifkoedegmiejfibdikk"
              >安装 Chrome 扩展 <span aria-hidden="true">↗</span></a
            >
          </div>
        </div>
      </section>

      <section class="split wrap" id="split" aria-labelledby="split-title">
        <div class="split-copy">
          <h2 id="split-title">
            <span>一张图，</span>
            <span>最多切 <strong>20</strong> 张</span>
          </h2>
          <p>
            横向、纵向切分都支持。<br />
            逐格微调、单独下载，或打包为 ZIP。
          </p>
        </div>

        <div class="demo" aria-label="切图演示">
          <div class="demo-header">
            <p>试切这张图</p>
            <fieldset class="modes" aria-label="预览模式" disabled>
              <button type="button" data-mode="original" aria-pressed="false">
                原图
              </button>
              <button type="button" data-mode="horizontal" aria-pressed="true">
                横向
              </button>
              <button type="button" data-mode="vertical" aria-pressed="false">
                纵向
              </button>
            </fieldset>
          </div>

          <div class="demo-image">
            <img
              id="sample"
              src="./coast.webp"
              width="1536"
              height="1024"
              alt="海岸公路、红色汽车和浪花"
            />
            <canvas
              width="1536"
              height="1024"
              role="img"
              aria-label="海岸示例图横向切分为 20 张"
              hidden
            ></canvas>
          </div>

          <div class="ruler" aria-hidden="true"></div>
          <div class="demo-count">
            <label for="slice-count">切片数量</label>
            <input
              id="slice-count"
              type="range"
              min="2"
              max="20"
              value="20"
              disabled
            />
            <output for="slice-count">20 张</output>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner wrap">
        <span class="brand">
          <img src="/assets/icon-128.png" width="40" height="40" alt="" />
          X-Puzzle-Kit
        </span>
        <a href="../">打开网页工作台 <span aria-hidden="true">↗</span></a>
        <a href="https://github.com/Shirolin/X-Puzzle-Kit">查看源码</a>
      </div>
    </footer>
  </body>
</html>
